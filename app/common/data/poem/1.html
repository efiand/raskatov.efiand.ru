<p>Приятен первый признак перемен:</p>
<p>Проталин плач природе петь позволил,</p>
<p>Птиц перелётных прекратился плен,</p>
<p>Призыв проснуться пролетел по полю.</p>

<p class="_separated">Прогрелась почва, почки подросли,</p>
<p>Плетёт паук поспешно паутину,</p>
<p>Поляны первоцветом поросли,</p>
<p>Покрывшись пестротканой пелериной.</p>
