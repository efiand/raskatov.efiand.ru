<p>Дует ветер северный</p>
<p>Мне в лицо печальное.</p>
<p>Слышу птиц потерянных</p>
<p>Пение прощальное.</p>

<p class="_separated">Спят жучки-вредители.</p>
<p>Раскричались вороны,</p>
<p>Словно перед зрителем —</p>
<p>Несмешные клоуны.</p>

<p class="_separated">Листья тихо падают,</p>
<p>Вдаль плывут по озеру.</p>
<p>И бульвар не радует:</p>
<p>Там прошли бульдозеры.</p>
