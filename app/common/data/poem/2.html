<p>Светлое Христово Воскресение</p>
<p>Мир встречает, радостью дыша:</p>
<p>Подарил Господь тепло весеннее —</p>
<p>И ликует каждая душа!</p>

<p class="_separated">С первыми лучами золотистыми</p>
<p>Встану в ожидании чудес,</p>
<p>Посмотрю с надеждой в небо чистое</p>
<p>И скажу: «Воистину воскрес!»</p>
