<p>Боясь улечься на забвенья дыбу,</p>
<p>Иные из поэтов пишут «рыбу».</p>
<p>На первый взгляд подумаешь: сонет!</p>
<p>Но вдумчиво прочтёшь — а смысла нет! —</p>

<p class="_separated">Ведь не всегда строка бежит легко,</p>
<p>Как тёплое парное молоко;</p>
<p>Когда ж оно становится прохладным —</p>
<p>Не будь, поэт, до «рыбы» слишком жадным!</p>
